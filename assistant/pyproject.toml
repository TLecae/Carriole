[project]
name = "etl-assistant"
version = "0.1.2"
description = "Assistant IA : fournisseurs (Anthropic, compatibles OpenAI), outils de lecture et d'action, boucle d'agent"
requires-python = ">=3.12"
dependencies = [
    "etl-engine",
    "anthropic>=0.40",
    "openai>=1.50",
    "pytest>=8.3",  # banc d'essai des modificateurs écrits par l'assistant (pytest dans le runtime embarqué)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_assistant"]

[tool.uv.sources]
etl-engine = { workspace = true }
