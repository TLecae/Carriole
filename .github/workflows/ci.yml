# Continuous integration: same steps as scripts/ci.ps1 (without Playwright or PostgreSQL), on Windows and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Bubblewrap, for the isolated Python code of server mode (ADR 0053)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest engine api store worker assistant -q -p no:cacheprovider -m "not slow" --ignore=engine/tests/test_postgres.py
      - name: Catalogue and translations up to date
        shell: bash
        run: |
          uv run --frozen etl modifiers doc --out "$RUNNER_TEMP/catalogue.md"
          diff docs/catalogue.md "$RUNNER_TEMP/catalogue.md"
          uv run --frozen etl modifiers doc --lang en --out "$RUNNER_TEMP/catalogue.en.md"
          diff docs/en/catalogue.md "$RUNNER_TEMP/catalogue.en.md"
          uv run --frozen etl i18n check --lang en

  postgres:
    # metadata store and server-mode scenarios on PostgreSQL (a disposable database, see docs/serveur.md)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: carriole
          POSTGRES_PASSWORD: carriole
          POSTGRES_DB: carriole_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carriole" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ETL_TEST_STORE_URL: postgresql+psycopg://carriole:carriole@localhost:5432/carriole_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run --frozen pytest store api/tests/test_auth.py api/tests/test_rights.py api/tests/test_audit.py -q -p no:cacheprovider

  docker:
    # server image (Dockerfile): builds, starts, requires an identity, and isolates the Python code of flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t carriole:ci .
      - name: Smoke test
        run: |
          docker run -d --name carriole -p 8080:8080 -e ETL_AUTH=proxy -e ETL_TRUSTED_PROXIES=0.0.0.0/0 carriole:ci
          for i in $(seq 60); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/flows)" = 401
          curl -fs -H 'X-Forwarded-User: essai' http://127.0.0.1:8080/api/auth/me | grep -q '"name":"essai"'
          curl -fs http://127.0.0.1:8080/ | grep -qi '<html'
      - name: Python code of flows in bubblewrap, inside the container
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cat > check.py <<'PY'
          from etl_engine.modifiers.python_script import PythonScript
          from etl_engine.testing import run_modifier, table

          code = "import os\ndef process(table, ctx):\n    return pa.table({'home': [os.path.exists('/var/lib/carriole')]})"
          out = run_modifier(PythonScript, {"code": code}, table(n=[1]))["output"]
          assert out.column("home").to_pylist() == [False], out
          print("PythonScript isolated: ok")
          PY
          docker run -i --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e ETL_MODE=server --entrypoint python carriole:ci - < check.py
      - if: always()
        run: docker logs carriole 2>&1 | tail -40 || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
