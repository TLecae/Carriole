# Release: a v* tag (e.g. v0.2.0) builds the Windows installer and the Linux AppImage and attaches them
# to a draft GitHub release (review, then publish). The tag must match the version in desktop/package.json.
# Workflow artifacts only carry the files to the release job: they are kept one day.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed   # relocatable Python (python-build-standalone), copied into the installers

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: powershell -ExecutionPolicy Bypass -File scripts\build_desktop.ps1
      - uses: actions/upload-artifact@v7
        id: unsigned
        with:
          name: windows-unsigned
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 1
      # Code signing by SignPath Foundation (free for open source projects), on tags only, once the repository
      # variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist. Each release is approved by hand in
      # SignPath, so the job waits for that approval. Artifact configuration: .signpath/artifact-configuration.xml
      - id: version
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: sign
        if: steps.version.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: carriole
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: desktop/release/signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: ${{ steps.sign.outcome == 'success' && 'desktop/release/signed/*.exe' || 'desktop/release/*.exe' }}
          if-no-files-found: error
          retention-days: 1

  linux:
    runs-on: ubuntu-22.04   # glibc 2.35: the AppImage runs on 2022 and newer distributions
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash scripts/build_desktop.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          body: |
            Free code signing provided by SignPath.io, certificate by SignPath Foundation.
            [Code signing policy](https://github.com/TLecae/Carriole#code-signing-policy).
          generate_release_notes: true
          files: dist/*
