# Release: a v* tag (e.g. v0.2.0) builds the Windows installer and the Linux AppImage and attaches them
# to a draft GitHub release (review, then publish). The tag must match the version in desktop/package.json.
# It also publishes the server image (Dockerfile) to ghcr.io/<owner>/carriole, tagged with the version and latest.
# Workflow artifacts only carry the files to the release job: they are kept one day.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed   # relocatable Python (python-build-standalone), copied into the installers

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6   # Electron and its packaging tools: fewer downloads from GitHub
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-windows-${{ hashFiles('desktop/package-lock.json', 'desktop/electron-builder.yml') }}
          restore-keys: electron-windows-
      - run: powershell -ExecutionPolicy Bypass -File scripts\build_desktop.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 1

  linux:
    runs-on: ubuntu-22.04   # glibc 2.35: the AppImage runs on 2022 and newer distributions
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('desktop/package-lock.json', 'desktop/electron-builder.yml') }}
          restore-keys: electron-linux-
      - run: bash scripts/build_desktop.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 1

  image:
    # server image for `docker compose pull` on any server (docker/compose.yaml, docs/serveur.md)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/carriole
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
