# Release: a v* tag (e.g. v0.2.0) builds the Windows installer and the Linux AppImage and attaches them
# to a draft GitHub release (review, then publish). The tag must match the version in desktop/package.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed   # relocatable Python (python-build-standalone), copied into the installers

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: powershell -ExecutionPolicy Bypass -File scripts\build_desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/release/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04   # glibc 2.35: the AppImage runs on 2022 and newer distributions
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build_desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: desktop/release/*.AppImage
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
