[project]
name = "etl-worker"
version = "0.1.2"
description = "Worker : exécute les runs dans un processus séparé"
requires-python = ">=3.12"
dependencies = ["etl-engine", "etl-store"]

[project.scripts]
etl-worker = "etl_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_worker"]

[tool.uv.sources]
etl-engine = { workspace = true }
etl-store = { workspace = true }
