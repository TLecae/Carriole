[project]
name = "etl-engine"
version = "0.1.3"
description = "Moteur d'exécution, SDK des modificateurs et CLI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "pyarrow>=17",
    "duckdb>=2.0",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "pyproj>=3.7",
    "numpy>=2.0",
    "psutil>=6",
    "psycopg[binary]>=3.2",
    "oracledb>=3.0",  # Oracle, mode « thin » : sans client Oracle
    "openpyxl>=3.1",
    "httpx>=0.27",
    "rasterio>=1.4",
    "numexpr>=2.10",
    "pystac-client>=0.8",
    "contourpy>=1.3",
]

[project.scripts]
etl = "etl_engine.cli:app"

# Modificateurs fournis avec le moteur ; les plugins tiers déclarent le même groupe.
[project.entry-points."etl.modifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_engine"]
