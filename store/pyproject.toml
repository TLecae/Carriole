[project]
name = "etl-store"
version = "0.1.3"
description = "Métadonnées : flux, runs, événements (SQLite par défaut, PostgreSQL possible)"
requires-python = ">=3.12"
dependencies = ["etl-engine", "sqlalchemy>=2.0", "cryptography>=43"]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_store"]

[tool.uv.sources]
etl-engine = { workspace = true }
