# Carriole en mode serveur (docs/serveur.md). Dans ce dossier :
#   1. copier carriole.env.example en carriole.env (non versionné) et y choisir le mot de passe du premier administrateur ;
#   2. docker compose up -d --build        (avec PostgreSQL : docker compose --profile postgres up -d --build)
# Placer un proxy HTTPS (nginx, Caddy, Traefik…) devant le port 8080 : les mots de passe ne doivent pas circuler en clair.

services:
  carriole:
    build: ..
    image: carriole:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # joignable depuis cette machine (et son proxy HTTPS) seulement
    env_file: carriole.env
    volumes:
      - carriole:/var/lib/carriole # réglages, cache des runs, journaux
      # données de l'organisation : un dossier de la machine, par exemple le partage de fichiers déjà monté
      # (/mnt/partage sous Linux, D:/donnees sous Windows) ; défaut : ./donnees
      - ${CARRIOLE_DONNEES:-./donnees}:/mnt/donnees
    # Code Python des flux (PythonScript) : isolé par bubblewrap, qui a besoin des espaces de noms utilisateur.
    # Le profil seccomp par défaut de Docker les refuse : soit autoriser `unshare` et `clone` avec un profil seccomp
    # adapté (security_opt: ["seccomp=chemin/profil.json"]), soit ETL_USER_CODE=deny dans carriole.env.

  db:
    profiles: ["postgres"] # métadonnées dans PostgreSQL (sinon SQLite dans le volume carriole)
    image: postgres:17
    restart: unless-stopped
    env_file: carriole.env # POSTGRES_PASSWORD ; ETL_DB_URL y désigne cette base
    environment:
      POSTGRES_USER: carriole
      POSTGRES_DB: carriole
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  carriole:
  db:
